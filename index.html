<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lucius: L'Ombra di Roma</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #020305;
            overflow: hidden;
            color: #e0e0e0;
            font-family: 'Courier New', Courier, monospace;
            user-select: none;
            -webkit-user-select: none;
        }
        #gameCanvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 15px;
            box-sizing: border-box;
        }
        #hud {
            font-size: 18px;
            text-shadow: 2px 2px 8px #000;
            font-weight: bold;
            color: #00e5ff;
            background: rgba(3, 5, 8, 0.9);
            padding: 10px 18px;
            border-radius: 8px;
            border: 1px solid #005577;
            align-self: flex-start;
            pointer-events: auto;
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.25);
        }
        #controls {
            position: relative;
            height: 170px;
            pointer-events: auto;
            width: 100%;
        }
        .btn {
            position: absolute;
            width: 70px;
            height: 70px;
            background-color: rgba(10, 20, 30, 0.92);
            border: 2px solid #00e5ff;
            border-radius: 50%;
            color: #00e5ff;
            font-size: 26px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.4);
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        .btn:active, .btn.pressed {
            background-color: rgba(0, 229, 255, 0.4);
            transform: scale(0.92);
        }
        #btnUp { left: 30px; bottom: 90px; }
        #btnDown { left: 30px; bottom: 5px; }
        #btnLeft { left: 8px; bottom: 48px; }
        #btnRight { left: 95px; bottom: 48px; }
        #btnAction { right: 25px; bottom: 35px; width: 85px; height: 85px; font-size: 34px; border-color: #ff3333; color: #ff3333; box-shadow: 0 0 20px rgba(255, 51, 51, 0.5); }
    </style>
</head>
<body>

    <canvas id="gameCanvas"></canvas>

    <div id="ui-layer">
        <div id="hud">
            LUCIUS | Vita: <span id="health">100</span> | Nemici: <span id="enemiesLeft">3</span>
        </div>
        
        <div id="controls">
            <div id="btnUp" class="btn">▲</div>
            <div id="btnDown" class="btn">▼</div>
            <div id="btnLeft" class="btn">◀</div>
            <div id="btnRight" class="btn">▶</div>
            <div id="btnAction" class="btn">⚔️</div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const healthSpan = document.getElementById('health');
        const enemiesLeftSpan = document.getElementById('enemiesLeft');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;
        let gameState = 'PLAYING';

        let player = {
            x: width / 2,
            y: height / 2,
            health: 100,
            speed: 4.5,
            direction: 'down',
            isAttacking: false
        };

        let enemies = [
            { x: width * 0.75, y: height * 0.3, health: 50 },
            { x: width * 0.25, y: height * 0.7, health: 50 },
            { x: width * 0.80, y: height * 0.75, health: 50 }
        ];

        let keys = {};

        function setupButton(id, keyName) {
            const btn = document.getElementById(id);
            const pressOn = (e) => { e.preventDefault(); keys[keyName] = true; btn.classList.add('pressed'); };
            const pressOff = (e) => { e.preventDefault(); keys[keyName] = false; btn.classList.remove('pressed'); };
            btn.addEventListener('pointerdown', pressOn);
            btn.addEventListener('pointerup', pressOff);
            btn.addEventListener('pointerleave', pressOff);
        }

        setupButton('btnUp', 'up');
        setupButton('btnDown', 'down');
        setupButton('btnLeft', 'left');
        setupButton('btnRight', 'right');

        document.getElementById('btnAction').addEventListener('pointerdown', (e) => {
            e.preventDefault();
            if (!player.isAttacking) {
                player.isAttacking = true;
                checkCombat();
                setTimeout(() => player.isAttacking = false, 250);
            }
        });

        // Sfondo immersivo delle catacombe con chiaroscuro ed effetti luce
        function drawBackground() {
            let bgGradient = ctx.createLinearGradient(0, 0, 0, height);
            bgGradient.addColorStop(0, '#010204');
            bgGradient.addColorStop(0.5, '#05090f');
            bgGradient.addColorStop(1, '#010203');
            ctx.fillStyle = bgGradient;
            ctx.fillRect(0, 0, width, height);

            // Pietre e architettura delle cripte
            ctx.strokeStyle = '#091017';
            ctx.lineWidth = 2;
            for (let x = 0; x < width; x += 140) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, height); ctx.stroke();
            }
            for (let y = 0; y < height; y += 140) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(width, y); ctx.stroke();
            }

            // Cerchi runici mistici luminosi sul pavimento
            ctx.save();
            ctx.strokeStyle = 'rgba(0, 229, 255, 0.15)';
            ctx.lineWidth = 3;
            ctx.shadowBlur = 20;
            ctx.shadowColor = '#00e5ff';
            ctx.beginPath();
            ctx.arc(width / 2, height / 2, 240, 0, Math.PI * 2);
            ctx.stroke();
            ctx.beginPath();
            ctx.arc(width / 2, height / 2, 130, 0, Math.PI * 2);
            ctx.stroke();
            ctx.restore();
        }

        // --- LUCIUS: Stile Pittorico Realistico con Direzione ---
        function drawPlayer() {
            ctx.save();
            ctx.translate(player.x, player.y);

            // Ombra profonda a terra
            ctx.fillStyle = 'rgba(0,0,0,0.75)';
            ctx.beginPath(); ctx.ellipse(0, 26, 22, 12, 0, 0, Math.PI * 2); ctx.fill();

            // Gradiente metallico avanzato per l'armatura
            let armorGrad = ctx.createLinearGradient(-16, -16, 16, 16);
            armorGrad.addColorStop(0, '#b0c4de');
            armorGrad.addColorStop(0.4, '#708090');
            armorGrad.addColorStop(1, '#2f4f4f');

            if (player.direction === 'up') {
                // DI SPALLE (Mantello imponente e retro elmo crestato)
                ctx.fillStyle = '#200505'; ctx.beginPath(); ctx.roundRect(-18, -18, 36, 36, 8); ctx.fill();
                ctx.fillStyle = armorGrad; ctx.beginPath(); ctx.arc(0, -4, 13, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = '#b30000'; ctx.fillRect(-4, -30, 8, 20); // Cresta elmo
            } 
            else if (player.direction === 'down') {
                // FRONTE (Corazza dettagliata, scudo romano e gladio)
                ctx.fillStyle = '#3a0a0a'; ctx.fillRect(-16, -16, 32, 32); // Mantello sotto
                ctx.fillStyle = armorGrad; ctx.beginPath(); ctx.roundRect(-14, -14, 28, 28, 6); ctx.fill(); // Lorica
                
                // Elmo Galea frontale con cimiero
                ctx.fillStyle = '#9cb0bc'; ctx.beginPath(); ctx.arc(0, -12, 13, Math.PI, 0, false); ctx.fill();
                ctx.fillStyle = '#cc0000'; ctx.fillRect(-4, -28, 8, 16);

                // Scudo (Scutum) decorato con bordi in oro
                ctx.fillStyle = '#7a140a'; ctx.strokeStyle = '#d4af37'; ctx.lineWidth = 2.5;
                ctx.beginPath(); ctx.roundRect(-24, -16, 12, 32, 4); ctx.fill(); ctx.stroke();
                ctx.fillStyle = '#ffd700'; ctx.beginPath(); ctx.arc(-18, 0, 4, 0, Math.PI * 2); ctx.fill(); // Umbone

                // Gladius / Attacco luminoso
                if (player.isAttacking) {
                    ctx.save();
                    ctx.shadowBlur = 25; ctx.shadowColor = '#00ffff';
                    ctx.fillStyle = '#ffffff'; ctx.fillRect(12, -6, 28, 8);
                    ctx.restore();
                } else {
                    ctx.fillStyle = '#d0d0d0'; ctx.fillRect(12, -2, 16, 5);
                    ctx.fillStyle = '#d4af37'; ctx.fillRect(10, -4, 4, 9);
                }
            } 
            else if (player.direction === 'left') {
                // SINISTRA (Profilo con scudo esposto)
                ctx.fillStyle = armorGrad; ctx.fillRect(-12, -14, 24, 26);
                ctx.fillStyle = '#9cb0bc'; ctx.beginPath(); ctx.arc(-2, -12, 12, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = '#cc0000'; ctx.fillRect(-7, -26, 12, 7);
                // Scudo a sinistra
                ctx.fillStyle = '#7a140a'; ctx.strokeStyle = '#d4af37'; ctx.lineWidth = 2;
                ctx.fillRect(-20, -15, 9, 28); ctx.strokeRect(-20, -15, 9, 28);
                
                if (player.isAttacking) {
                    ctx.save();
                    ctx.shadowBlur = 25; ctx.shadowColor = '#00ffff';
                    ctx.fillStyle = '#ffffff'; ctx.fillRect(-34, -5, 22, 8);
                    ctx.restore();
                }
            } 
            else if (player.direction === 'right') {
                // DESTRA (Profilo con gladio sguainato)
                ctx.fillStyle = armorGrad; ctx.fillRect(-12, -14, 24, 26);
                ctx.fillStyle = '#9cb0bc'; ctx.beginPath(); ctx.arc(2, -12, 12, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = '#cc0000'; ctx.fillRect(-5, -26, 12, 7);
                // Scudo dietro
                ctx.fillStyle = '#7a140a'; ctx.strokeStyle = '#d4af37'; ctx.lineWidth = 2;
                ctx.fillRect(11, -15, 9, 28); ctx.strokeRect(11, -15, 9, 28);

                if (player.isAttacking) {
                    ctx.save();
                    ctx.shadowBlur = 25; ctx.shadowColor = '#00ffff';
                    ctx.fillStyle = '#ffffff'; ctx.fillRect(12, -5, 22, 8);
                    ctx.restore();
                } else {
                    ctx.fillStyle = '#d0d0d0'; ctx.fillRect(12, -2, 16, 5);
                    ctx.fillStyle = '#d4af37'; ctx.fillRect(10, -4, 4, 9);
                }
            }

            ctx.restore();
        }

        // --- NEMICI: Legionari Ombra ad alta definizione con aura azzurra ---
        function drawEnemies() {
            enemies.forEach(enemy => {
                if (enemy.health > 0) {
                    ctx.save();
                    ctx.translate(enemy.x, enemy.y);

                    // Aura spettrale intensa
                    ctx.save();
                    ctx.shadowBlur = 20;
                    ctx.shadowColor = '#00e5ff';
                    ctx.fillStyle = 'rgba(0, 229, 255, 0.12)';
                    ctx.beginPath(); ctx.arc(0, 0, 30, 0, Math.PI * 2); ctx.fill();
                    ctx.restore();

                    // Corpo corrotto scuro
                    ctx.fillStyle = '#0d131a';
                    ctx.beginPath(); ctx.arc(0, 0, 20, 0, Math.PI * 2); ctx.fill();

                    // Armatura arrugginita
                    ctx.fillStyle = '#18232c';
                    ctx.beginPath(); ctx.roundRect(-14, -14, 28, 28, 6); ctx.fill();

                    // Elmo antico corrotto
                    ctx.fillStyle = '#0d1217';
                    ctx.beginPath(); ctx.arc(0, -12, 12, Math.PI, 0, false); ctx.fill();

                    // Occhi azzurri fluorescenti penetranti
                    ctx.shadowBlur = 15;
                    ctx.shadowColor = '#00ffff';
                    ctx.fillStyle = '#00ffff';
                    ctx.fillRect(-6, -16, 4, 4);
                    ctx.fillRect(2, -16, 4, 4);
                    ctx.shadowBlur = 0;

                    ctx.restore();
                }
            });
        }

        function drawHUD() {
            healthSpan.innerText = Math.max(0, Math.floor(player.health));
            enemiesLeftSpan.innerText = enemies.filter(e => e.health > 0).length;

            if (gameState === 'LOSE') {
                ctx.fillStyle = 'rgba(2, 3, 5, 0.95)';
                ctx.fillRect(0, 0, width, height);
                ctx.fillStyle = '#ff3333';
                ctx.shadowBlur = 20; ctx.shadowColor = '#ff0000';
                ctx.font = 'bold 28px Courier New';
                ctx.textAlign = 'center';
                ctx.fillText("ROMA È CADUTA NELLE TENEBRE", width / 2, height / 2);
                ctx.shadowBlur = 0;
            }
            if (gameState === 'WIN') {
                ctx.fillStyle = 'rgba(2, 3, 5, 0.95)';
                ctx.fillRect(0, 0, width, height);
                ctx.fillStyle = '#00e5ff';
                ctx.shadowBlur = 20; ctx.shadowColor = '#00e5ff';
                ctx.font = 'bold 28px Courier New';
                ctx.textAlign = 'center';
                ctx.fillText("CRIPTA PURIFICATA! IL MALE È RESPINTO", width / 2, height / 2);
                ctx.shadowBlur = 0;
            }
        }

        function update() {
            if (gameState !== 'PLAYING') return;

            if (keys['up'] && player.y > 60) { player.y -= player.speed; player.direction = 'up'; }
            if (keys['down'] && player.y < height - 200) { player.y += player.speed; player.direction = 'down'; }
            if (keys['left'] && player.x > 50) { player.x -= player.speed; player.direction = 'left'; }
            if (keys['right'] && player.x < width - 50) { player.x += player.speed; player.direction = 'right'; }

            enemies.forEach(enemy => {
                if (enemy.health > 0) {
                    let dx = player.x - enemy.x;
                    let dy = player.y - enemy.y;
                    let dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist > 5) {
                        enemy.x += (dx / dist) * 0.65;
                        enemy.y += (dy / dist) * 0.65;
                    }

                    if (dist < 38) {
                        player.health -= 0.35;
                        if (player.health <= 0) gameState = 'LOSE';
                    }
                }
            });

            let aliveEnemies = enemies.filter(e => e.health > 0);
            if (aliveEnemies.length === 0 && gameState === 'PLAYING') {
                gameState = 'WIN';
            }
        }

        function checkCombat() {
            enemies.forEach(enemy => {
                let dx = player.x - enemy.x;
                let dy = player.y - enemy.y;
                let dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < 80 && enemy.health > 0) {
                    enemy.health -= 25;
                }
            });
        }

        function gameLoop() {
            update();
            drawBackground();
            drawPlayer();
            drawEnemies();
            drawHUD();
            requestAnimationFrame(gameLoop);
        }

        gameLoop();

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });
    </script>
</body>
</html>
