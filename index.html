<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lucius: L'Ombra di Roma</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #04070a;
            overflow: hidden;
            color: #e0e0e0;
            font-family: 'Courier New', Courier, monospace;
            user-select: none;
            -webkit-user-select: none;
        }
        #gameCanvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 15px;
            box-sizing: border-box;
        }
        #hud {
            font-size: 18px;
            text-shadow: 2px 2px 6px #000;
            font-weight: bold;
            color: #00e5ff;
            background: rgba(0, 0, 0, 0.85);
            padding: 8px 15px;
            border-radius: 8px;
            border: 1px solid #005577;
            align-self: flex-start;
            pointer-events: auto;
        }
        #controls {
            position: relative;
            height: 160px;
            pointer-events: auto;
            width: 100%;
        }
        .btn {
            position: absolute;
            width: 65px;
            height: 65px;
            background-color: rgba(20, 35, 45, 0.85);
            border: 2px solid #00e5ff;
            border-radius: 50%;
            color: #00e5ff;
            font-size: 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 10px rgba(0, 229, 255, 0.4);
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        .btn:active, .btn.pressed {
            background-color: rgba(0, 229, 255, 0.5);
            transform: scale(0.92);
        }
        #btnUp { left: 25px; bottom: 85px; }
        #btnDown { left: 25px; bottom: 5px; }
        #btnLeft { left: 5px; bottom: 45px; }
        #btnRight { left: 85px; bottom: 45px; }
        #btnAction { right: 25px; bottom: 35px; width: 80px; height: 80px; font-size: 32px; border-color: #ff3333; color: #ff3333; }
    </style>
</head>
<body>

    <canvas id="gameCanvas"></canvas>

    <div id="ui-layer">
        <div id="hud">
            LUCIUS | Vita: <span id="health">100</span> | Nemici: <span id="enemiesLeft">3</span>
        </div>
        
        <div id="controls">
            <div id="btnUp" class="btn">▲</div>
            <div id="btnDown" class="btn">▼</div>
            <div id="btnLeft" class="btn">◀</div>
            <div id="btnRight" class="btn">▶</div>
            <div id="btnAction" class="btn">⚔️</div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const healthSpan = document.getElementById('health');
        const enemiesLeftSpan = document.getElementById('enemiesLeft');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;
        let gameState = 'PLAYING';

        // Posizione iniziale di Lucius (RPG Top-Down)
        let player = {
            x: width / 2,
            y: height / 2,
            width: 44,
            height: 60,
            health: 100,
            speed: 4.5,
            direction: 'down',
            isAttacking: false
        };

        // Nemici nelle catacombe
        let enemies = [
            { x: width * 0.75, y: height * 0.3, width: 44, height: 60, health: 50 },
            { x: width * 0.25, y: height * 0.7, width: 44, height: 60, health: 50 },
            { x: width * 0.80, y: height * 0.75, width: 44, height: 60, health: 50 }
        ];

        let keys = {};

        function setupButton(id, keyName) {
            const btn = document.getElementById(id);
            const pressOn = (e) => { e.preventDefault(); keys[keyName] = true; btn.classList.add('pressed'); };
            const pressOff = (e) => { e.preventDefault(); keys[keyName] = false; btn.classList.remove('pressed'); };
            btn.addEventListener('pointerdown', pressOn);
            btn.addEventListener('pointerup', pressOff);
            btn.addEventListener('pointerleave', pressOff);
        }

        setupButton('btnUp', 'up');
        setupButton('btnDown', 'down');
        setupButton('btnLeft', 'left');
        setupButton('btnRight', 'right');

        document.getElementById('btnAction').addEventListener('pointerdown', (e) => {
            e.preventDefault();
            if (!player.isAttacking) {
                player.isAttacking = true;
                checkCombat();
                setTimeout(() => player.isAttacking = false, 250);
            }
        });

        // Sfondo delle catacombe in stile dark fantasy romano
        function drawBackground() {
            let bgGradient = ctx.createLinearGradient(0, 0, 0, height);
            bgGradient.addColorStop(0, '#030508');
            bgGradient.addColorStop(0.5, '#080e14');
            bgGradient.addColorStop(1, '#020305');
            ctx.fillStyle = bgGradient;
            ctx.fillRect(0, 0, width, height);

            // Griglia delle pietre delle catacombe
            ctx.strokeStyle = '#0c1620';
            ctx.lineWidth = 2;
            for (let x = 0; x < width; x += 120) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, height); ctx.stroke();
            }
            for (let y = 0; y < height; y += 120) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(width, y); ctx.stroke();
            }

            // Rune azzurre luminose sul pavimento
            ctx.strokeStyle = 'rgba(0, 229, 255, 0.08)';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(width / 2, height / 2, 200, 0, Math.PI * 2);
            ctx.stroke();
        }

        // Disegno dettagliato di Lucius (Legionario Romano)
        function drawPlayer() {
            ctx.save();
            ctx.translate(player.x, player.y);

            // Mantello scuro
            ctx.fillStyle = '#3a0f0f';
            ctx.fillRect(-14, -18, 28, 36);

            // Tunica rossa
            ctx.fillStyle = '#7a1c1c';
            ctx.fillRect(-12, -15, 24, 30);

            // Armatura Lorica Segmentata
            ctx.fillStyle = '#6b7c85';
            ctx.fillRect(-10, -12, 20, 22);
            ctx.fillStyle = '#323d44';
            ctx.fillRect(-10, -6, 20, 2);
            ctx.fillRect(-10, 0, 20, 2);

            // Elmo romano con cimiero rosso
            ctx.fillStyle = '#9cb0bc';
            ctx.fillRect(-9, -24, 18, 14);
            ctx.fillStyle = '#b30000';
            ctx.fillRect(-3, -31, 6, 9);

            // Scudo (Scutum) romano dorato/rosso
            ctx.fillStyle = '#8b1e0f';
            ctx.fillRect(-22, -10, 10, 26);
            ctx.strokeStyle = '#d4af37';
            ctx.lineWidth = 1.5;
            ctx.strokeRect(-22, -10, 10, 26);

            // Gladius o fendente d'attacco luminoso
            if (player.isAttacking) {
                ctx.shadowBlur = 15;
                ctx.shadowColor = '#00e5ff';
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(10, -6, 22, 6);
                ctx.shadowBlur = 0;
            } else {
                ctx.fillStyle = '#d0d0d0';
                ctx.fillRect(10, -2, 14, 4);
                ctx.fillStyle = '#d4af37';
                ctx.fillRect(8, -3, 3, 6);
            }

            ctx.restore();
        }

        // Disegno dei Legionari Ombra (Nemici con occhi azzurri di brace)
        function drawEnemies() {
            enemies.forEach(enemy => {
                if (enemy.health > 0) {
                    ctx.save();
                    ctx.translate(enemy.x, enemy.y);

                    // Aura spettrale scura
                    ctx.fillStyle = 'rgba(0, 229, 255, 0.06)';
                    ctx.beginPath();
                    ctx.arc(0, 0, 28, 0, Math.PI * 2);
                    ctx.fill();

                    // Corpo corrotto
                    ctx.fillStyle = '#16222b';
                    ctx.fillRect(-12, -15, 24, 30);
                    ctx.fillStyle = '#2b3942';
                    ctx.fillRect(-10, -12, 20, 22);
                    ctx.fillStyle = '#1a242c';
                    ctx.fillRect(-9, -24, 18, 14);

                    // Occhi azzurri fluorescenti
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = '#00e5ff';
                    ctx.fillStyle = '#00ffff';
                    ctx.fillRect(-5, -20, 3, 3);
                    ctx.fillRect(2, -20, 3, 3);
                    ctx.shadowBlur = 0;

                    ctx.restore();
                }
            });
        }

        function drawHUD() {
            healthSpan.innerText = Math.max(0, Math.floor(player.health));
            enemiesLeftSpan.innerText = enemies.filter(e => e.health > 0).length;

            if (gameState === 'LOSE') {
                ctx.fillStyle = 'rgba(2, 3, 5, 0.92)';
                ctx.fillRect(0, 0, width, height);
                ctx.fillStyle = '#ff3333';
                ctx.font = 'bold 26px Courier New';
                ctx.textAlign = 'center';
                ctx.fillText("ROMA È CADUTA NELLE TENEBRE", width / 2, height / 2);
            }
            if (gameState === 'WIN') {
                ctx.fillStyle = 'rgba(2, 3, 5, 0.92)';
                ctx.fillRect(0, 0, width, height);
                ctx.fillStyle = '#00e5ff';
                ctx.font = 'bold 26px Courier New';
                ctx.textAlign = 'center';
                ctx.fillText("CRIPTA PURIFICATA! IL MALE È RESPINTO", width / 2, height / 2);
            }
        }

        function update() {
            if (gameState !== 'PLAYING') return;

            if (keys['up'] && player.y > 60) player.y -= player.speed;
            if (keys['down'] && player.y < height - 180) player.y += player.speed;
            if (keys['left'] && player.x > 50) player.x -= player.speed;
            if (keys['right'] && player.x < width - 50) player.x += player.speed;

            // IA Nemici (inseguimento top-down)
            enemies.forEach(enemy => {
                if (enemy.health > 0) {
                    let dx = player.x - enemy.x;
                    let dy = player.y - enemy.y;
                    let dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist > 5) {
                        enemy.x += (dx / dist) * 0.65;
                        enemy.y += (dy / dist) * 0.65;
                    }

                    if (dist < 35) {
                        player.health -= 0.35;
                        if (player.health <= 0) gameState = 'LOSE';
                    }
                }
            });

            let aliveEnemies = enemies.filter(e => e.health > 0);
            if (aliveEnemies.length === 0 && gameState === 'PLAYING') {
                gameState = 'WIN';
            }
        }

        function checkCombat() {
            enemies.forEach(enemy => {
                let dx = player.x - enemy.x;
                let dy = player.y - enemy.y;
                let dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < 75 && enemy.health > 0) {
                    enemy.health -= 25;
                }
            });
        }

        function gameLoop() {
            update();
            drawBackground();
            player.isAttacking ? null : null; // render order
            drawPlayer();
            drawEnemies();
            drawHUD();
            requestAnimationFrame(gameLoop);
        }

        gameLoop();

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });
    </script>
</body>
</html>
