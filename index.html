<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lucius: L'Ombra di Roma</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #020305;
            overflow: hidden;
            color: #e0e0e0;
            font-family: 'Courier New', Courier, monospace;
            user-select: none;
            -webkit-user-select: none;
        }
        #gameCanvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 15px;
            box-sizing: border-box;
        }
        #hud {
            font-size: 18px;
            text-shadow: 2px 2px 8px #000;
            font-weight: bold;
            color: #00e5ff;
            background: rgba(3, 5, 8, 0.9);
            padding: 10px 18px;
            border-radius: 8px;
            border: 1px solid #005577;
            align-self: flex-start;
            pointer-events: auto;
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.25);
        }
        #controls {
            position: relative;
            height: 170px;
            pointer-events: auto;
            width: 100%;
        }
        .btn {
            position: absolute;
            width: 70px;
            height: 70px;
            background-color: rgba(10, 20, 30, 0.92);
            border: 2px solid #00e5ff;
            border-radius: 50%;
            color: #00e5ff;
            font-size: 26px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.4);
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        .btn:active, .btn.pressed {
            background-color: rgba(0, 229, 255, 0.4);
            transform: scale(0.92);
        }
        #btnUp { left: 30px; bottom: 90px; }
        #btnDown { left: 30px; bottom: 5px; }
        #btnLeft { left: 8px; bottom: 48px; }
        #btnRight { left: 95px; bottom: 48px; }
        #btnAction { right: 25px; bottom: 35px; width: 85px; height: 85px; font-size: 34px; border-color: #ff3333; color: #ff3333; box-shadow: 0 0 20px rgba(255, 51, 51, 0.5); }
    </style>
</head>
<body>

    <canvas id="gameCanvas"></canvas>

    <div id="ui-layer">
        <div id="hud">
            LUCIUS | Vita: <span id="health">100</span> | Nemici: <span id="enemiesLeft">3</span>
        </div>
        
        <div id="controls">
            <div id="btnUp" class="btn">▲</div>
            <div id="btnDown" class="btn">▼</div>
            <div id="btnLeft" class="btn">◀</div>
            <div id="btnRight" class="btn">▶</div>
            <div id="btnAction" class="btn">⚔️</div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const healthSpan = document.getElementById('health');
        const enemiesLeftSpan = document.getElementById('enemiesLeft');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;
        let gameState = 'PLAYING';

        // CARICAMENTO DELLO SPRITE SHEET NATIVO (PNG trasparente)
        const spriteSheet = new Image();
        spriteSheet.src = 'assets/lucius.png'; 

        // Dimensioni calcolate perfettamente sui tuoi dati (4337x2422 / 10x4)
        let spriteFrameWidth = 434;  
        let spriteFrameHeight = 606; 

        let player = {
            x: width / 2,
            y: height / 2,
            width: 64,  // Dimensione a schermo del personaggio (ridimensionato automaticamente)
            height: 64, 
            health: 100,
            speed: 4.5,
            direction: 'down',
            frameX: 0,
            isAttacking: false
        };

        let enemies = [
            { x: width * 0.75, y: height * 0.3, width: 48, height: 48, health: 50 },
            { x: width * 0.25, y: height * 0.7, width: 48, height: 48, health: 50 },
            { x: width * 0.80, y: height * 0.75, width: 48, height: 48, health: 50 }
        ];

        let keys = {};

        function setupButton(id, keyName) {
            const btn = document.getElementById(id);
            const pressOn = (e) => { e.preventDefault(); keys[keyName] = true; btn.classList.add('pressed'); };
            const pressOff = (e) => { e.preventDefault(); keys[keyName] = false; btn.classList.remove('pressed'); };
            btn.addEventListener('pointerdown', pressOn);
            btn.addEventListener('pointerup', pressOff);
            btn.addEventListener('pointerleave', pressOff);
        }

        setupButton('btnUp', 'up');
        setupButton('btnDown', 'down');
        setupButton('btnLeft', 'left');
        setupButton('btnRight', 'right');

        document.getElementById('btnAction').addEventListener('pointerdown', (e) => {
            e.preventDefault();
            if (!player.isAttacking) {
                player.isAttacking = true;
                checkCombat();
                setTimeout(() => player.isAttacking = false, 250);
            }
        });

        function drawBackground() {
            let bgGradient = ctx.createLinearGradient(0, 0, 0, height);
            bgGradient.addColorStop(0, '#010204');
            bgGradient.addColorStop(0.5, '#05090f');
            bgGradient.addColorStop(1, '#010203');
            ctx.fillStyle = bgGradient;
            ctx.fillRect(0, 0, width, height);

            ctx.strokeStyle = '#091017';
            ctx.lineWidth = 2;
            for (let x = 0; x < width; x += 140) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, height); ctx.stroke();
            }
            for (let y = 0; y < height; y += 140) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(width, y); ctx.stroke();
            }
        }

        function drawPlayer() {
            ctx.save();
            ctx.translate(player.x, player.y);

            // Mappatura delle 4 righe del tuo sprite sheet
            let rowY = 0; 
            if (player.direction === 'down') rowY = 0; 
            else if (player.direction === 'left') rowY = 1; 
            else if (player.direction === 'right') rowY = 2; 
            else if (player.direction === 'up') rowY = 3; 

            if (spriteSheet.complete && spriteSheet.naturalWidth !== 0) {
                ctx.drawImage(
                    spriteSheet,
                    player.frameX * spriteFrameWidth, rowY * spriteFrameHeight, spriteFrameWidth, spriteFrameHeight,
                    -player.width / 2, -player.height / 2, player.width, player.height
                );
            } else {
                ctx.fillStyle = '#7a1c1c';
                ctx.fillRect(-player.width / 2, -player.height / 2, player.width, player.height);
            }

            ctx.restore();
        }

        function drawEnemies() {
            enemies.forEach(enemy => {
                if (enemy.health > 0) {
                    ctx.save();
                    ctx.translate(enemy.x, enemy.y);
                    
                    ctx.fillStyle = '#16222b';
                    ctx.beginPath();
                    ctx.arc(0, 0, 20, 0, Math.PI * 2);
                    ctx.fill();
                    
                    ctx.fillStyle = '#00ffff';
                    ctx.fillRect(-5, -5, 3, 3);
                    ctx.fillRect(2, -5, 3, 3);
                    
                    ctx.restore();
                }
            });
        }

        function drawHUD() {
            healthSpan.innerText = Math.max(0, Math.floor(player.health));
            enemiesLeftSpan.innerText = enemies.filter(e => e.health > 0).length;

            if (gameState === 'LOSE') {
                ctx.fillStyle = 'rgba(2, 3, 5, 0.95)';
                ctx.fillRect(0, 0, width, height);
                ctx.fillStyle = '#ff3333';
                ctx.font = 'bold 28px Courier New';
                ctx.textAlign = 'center';
                ctx.fillText("SEI STATO SCONFITTO", width / 2, height / 2);
            }
            if (gameState === 'WIN') {
                ctx.fillStyle = 'rgba(2, 3, 5, 0.95)';
                ctx.fillRect(0, 0, width, height);
                ctx.fillStyle = '#00e5ff';
                ctx.font = 'bold 28px Courier New';
                ctx.textAlign = 'center';
                ctx.fillText("VITTORIA!", width / 2, height / 2);
            }
        }

        function update() {
            if (gameState !== 'PLAYING') return;

            let moving = false;
            if (keys['up'] && player.y > 60) { player.y -= player.speed; player.direction = 'up'; moving = true; }
            if (keys['down'] && player.y < height - 200) { player.y += player.speed; player.direction = 'down'; moving = true; }
            if (keys['left'] && player.x > 50) { player.x -= player.speed; player.direction = 'left'; moving = true; }
            if (keys['right'] && player.x < width - 50) { player.x += player.speed; player.direction = 'right'; moving = true; }

            if (moving) {
                // Scorriamo tra le 10 colonne disponibili per l'animazione
                player.frameX = (Math.floor(Date.now() / 120) % 10); 
            } else {
                player.frameX = 0; 
            }

            enemies.forEach(enemy => {
                if (enemy.health > 0) {
                    let dx = player.x - enemy.x;
                    let dy = player.y - enemy.y;
                    let dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist > 5) {
                        enemy.x += (dx / dist) * 0.65;
                        enemy.y += (dy / dist) * 0.65;
                    }

                    if (dist < 40) {
                        player.health -= 0.35;
                        if (player.health <= 0) gameState = 'LOSE';
                    }
                }
            });

            let aliveEnemies = enemies.filter(e => e.health > 0);
            if (aliveEnemies.length === 0 && gameState === 'PLAYING') {
                gameState = 'WIN';
            }
        }

        function checkCombat() {
            enemies.forEach(enemy => {
                let dx = player.x - enemy.x;
                let dy = player.y - enemy.y;
                let dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < 80 && enemy.health > 0) {
                    enemy.health -= 25;
                }
            });
        }

        function gameLoop() {
            update();
            drawBackground();
            drawPlayer();
            drawEnemies();
            drawHUD();
            requestAnimationFrame(gameLoop);
        }

        // Avvio del gioco
        gameLoop();

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });
    </script>
</body>
</html>
