<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lucius: L'Ombra di Roma</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #030508;
            overflow: hidden;
            color: #e0e0e0;
            font-family: 'Courier New', Courier, monospace;
            user-select: none;
            -webkit-user-select: none;
        }
        #gameCanvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 15px;
            box-sizing: border-box;
        }
        #hud {
            font-size: 18px;
            text-shadow: 2px 2px 6px #000;
            font-weight: bold;
            color: #00e5ff;
            background: rgba(0, 0, 0, 0.85);
            padding: 10px 18px;
            border-radius: 8px;
            border: 1px solid #005577;
            align-self: flex-start;
            pointer-events: auto;
            box-shadow: 0 0 10px rgba(0, 229, 255, 0.2);
        }
        #controls {
            position: relative;
            height: 170px;
            pointer-events: auto;
            width: 100%;
        }
        .btn {
            position: absolute;
            width: 70px;
            height: 70px;
            background-color: rgba(15, 25, 35, 0.9);
            border: 2px solid #00e5ff;
            border-radius: 50%;
            color: #00e5ff;
            font-size: 26px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.4);
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        .btn:active, .btn.pressed {
            background-color: rgba(0, 229, 255, 0.4);
            transform: scale(0.92);
        }
        #btnUp { left: 30px; bottom: 90px; }
        #btnDown { left: 30px; bottom: 5px; }
        #btnLeft { left: 8px; bottom: 48px; }
        #btnRight { left: 95px; bottom: 48px; }
        #btnAction { right: 25px; bottom: 35px; width: 85px; height: 85px; font-size: 34px; border-color: #ff3333; color: #ff3333; box-shadow: 0 0 20px rgba(255, 51, 51, 0.5); }
    </style>
</head>
<body>

    <canvas id="gameCanvas"></canvas>

    <div id="ui-layer">
        <div id="hud">
            LUCIUS | Vita: <span id="health">100</span> | Nemici: <span id="enemiesLeft">3</span>
        </div>
        
        <div id="controls">
            <div id="btnUp" class="btn">▲</div>
            <div id="btnDown" class="btn">▼</div>
            <div id="btnLeft" class="btn">◀</div>
            <div id="btnRight" class="btn">▶</div>
            <div id="btnAction" class="btn">⚔️</div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const healthSpan = document.getElementById('health');
        const enemiesLeftSpan = document.getElementById('enemiesLeft');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;
        let gameState = 'PLAYING';

        let player = {
            x: width / 2,
            y: height / 2,
            health: 100,
            speed: 4.5,
            direction: 'down', // Direzione iniziale ('up', 'down', 'left', 'right')
            isAttacking: false
        };

        let enemies = [
            { x: width * 0.75, y: height * 0.3, health: 50 },
            { x: width * 0.25, y: height * 0.7, health: 50 },
            { x: width * 0.80, y: height * 0.75, health: 50 }
        ];

        let keys = {};

        function setupButton(id, keyName) {
            const btn = document.getElementById(id);
            const pressOn = (e) => { e.preventDefault(); keys[keyName] = true; btn.classList.add('pressed'); };
            const pressOff = (e) => { e.preventDefault(); keys[keyName] = false; btn.classList.remove('pressed'); };
            btn.addEventListener('pointerdown', pressOn);
            btn.addEventListener('pointerup', pressOff);
            btn.addEventListener('pointerleave', pressOff);
        }

        setupButton('btnUp', 'up');
        setupButton('btnDown', 'down');
        setupButton('btnLeft', 'left');
        setupButton('btnRight', 'right');

        document.getElementById('btnAction').addEventListener('pointerdown', (e) => {
            e.preventDefault();
            if (!player.isAttacking) {
                player.isAttacking = true;
                checkCombat();
                setTimeout(() => player.isAttacking = false, 250);
            }
        });

        function drawBackground() {
            let bgGradient = ctx.createLinearGradient(0, 0, 0, height);
            bgGradient.addColorStop(0, '#030508');
            bgGradient.addColorStop(0.5, '#070c12');
            bgGradient.addColorStop(1, '#010204');
            ctx.fillStyle = bgGradient;
            ctx.fillRect(0, 0, width, height);

            ctx.strokeStyle = '#0c1620';
            ctx.lineWidth = 2;
            for (let x = 0; x < width; x += 120) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, height); ctx.stroke();
            }
            for (let y = 0; y < height; y += 120) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(width, y); ctx.stroke();
            }

            // Geometria runica sul pavimento
            ctx.strokeStyle = 'rgba(0, 229, 255, 0.1)';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.arc(width / 2, height / 2, 200, 0, Math.PI * 2);
            ctx.stroke();
        }

        // --- LUCIUS CON DIREZIONE DINAMICA ---
        function drawPlayer() {
            ctx.save();
            ctx.translate(player.x, player.y);

            // Ombra
            ctx.fillStyle = 'rgba(0,0,0,0.6)';
            ctx.beginPath();
            ctx.arc(0, 24, 20, 0, Math.PI * 2);
            ctx.fill();

            // Render in base alla direzione in cui si muove
            if (player.direction === 'up') {
                // Vista di spalle
                ctx.fillStyle = '#2a0a0a'; // Mantello coprente
                ctx.fillRect(-14, -16, 28, 32);
                ctx.fillStyle = '#9cb0bc'; // Retro elmo
                ctx.beginPath(); ctx.arc(0, -10, 11, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = '#cc0000'; // Cimiero visto da dietro
                ctx.fillRect(-3, -24, 6, 14);
            } 
            else if (player.direction === 'down') {
                // Vista frontale
                ctx.fillStyle = '#3a0f0f'; // Mantello dietro
                ctx.fillRect(-14, -14, 28, 28);
                ctx.fillStyle = '#7a1c1c'; // Tunica
                ctx.beginPath(); ctx.arc(0, 0, 18, 0, Math.PI * 2); ctx.fill();
                // Armatura Lorica
                ctx.fillStyle = '#6b7c85';
                ctx.fillRect(-12, -12, 24, 22);
                // Elmo e cimiero frontale
                ctx.fillStyle = '#b0c4de';
                ctx.beginPath(); ctx.arc(0, -12, 12, Math.PI, 0, false); ctx.fill();
                ctx.fillStyle = '#cc0000';
                ctx.fillRect(-3, -25, 6, 13);
                // Scudo a sinistra
                ctx.fillStyle = '#7a140a'; ctx.strokeStyle = '#d4af37'; ctx.lineWidth = 2;
                ctx.fillRect(-22, -14, 10, 26); ctx.strokeRect(-22, -14, 10, 26);
                // Gladius o attacco frontale
                if (player.isAttacking) {
                    ctx.shadowBlur = 20; ctx.shadowColor = '#00ffff';
                    ctx.fillStyle = '#ffffff'; ctx.fillRect(12, -6, 24, 6);
                    ctx.shadowBlur = 0;
                } else {
                    ctx.fillStyle = '#d0d0d0'; ctx.fillRect(12, -2, 14, 4);
                }
            } 
            else if (player.direction === 'left') {
                // Vista laterale sinistra
                ctx.fillStyle = '#7a1c1c'; ctx.fillRect(-10, -12, 20, 24);
                ctx.fillStyle = '#6b7c85'; ctx.fillRect(-8, -10, 16, 20); // Armatura
                ctx.fillStyle = '#b0c4de'; ctx.beginPath(); ctx.arc(-2, -12, 11, 0, Math.PI * 2); ctx.fill(); // Elmo
                ctx.fillStyle = '#cc0000'; ctx.fillRect(-6, -23, 10, 6); // Cimiero laterale
                // Scudo davanti a sinistra
                ctx.fillStyle = '#7a140a'; ctx.strokeStyle = '#d4af37'; ctx.lineWidth = 2;
                ctx.fillRect(-18, -14, 8, 26); ctx.strokeRect(-18, -14, 8, 26);
                if (player.isAttacking) {
                    ctx.shadowBlur = 20; ctx.shadowColor = '#00ffff';
                    ctx.fillStyle = '#ffffff'; ctx.fillRect(-32, -4, 20, 6);
                    ctx.shadowBlur = 0;
                }
            } 
            else if (player.direction === 'right') {
                // Vista laterale destra
                ctx.fillStyle = '#7a1c1c'; ctx.fillRect(-10, -12, 20, 24);
                ctx.fillStyle = '#6b7c85'; ctx.fillRect(-8, -10, 16, 20); // Armatura
                ctx.fillStyle = '#b0c4de'; ctx.beginPath(); ctx.arc(2, -12, 11, 0, Math.PI * 2); ctx.fill(); // Elmo
                ctx.fillStyle = '#cc0000'; ctx.fillRect(-4, -23, 10, 6); // Cimiero laterale
                // Scudo dietro a destra
                ctx.fillStyle = '#7a140a'; ctx.strokeStyle = '#d4af37'; ctx.lineWidth = 2;
                ctx.fillRect(10, -14, 8, 26); ctx.strokeRect(10, -14, 8, 26);
                if (player.isAttacking) {
                    ctx.shadowBlur = 20; ctx.shadowColor = '#00ffff';
                    ctx.fillStyle = '#ffffff'; ctx.fillRect(12, -4, 20, 6);
                    ctx.shadowBlur = 0;
                } else {
                    ctx.fillStyle = '#d0d0d0'; ctx.fillRect(12, -2, 14, 4);
                }
            }

            ctx.restore();
        }

        // --- NEMICI CORROTTI ---
        function drawEnemies() {
            enemies.forEach(enemy => {
                if (enemy.health > 0) {
                    ctx.save();
                    ctx.translate(enemy.x, enemy.y);

                    ctx.save();
                    ctx.shadowBlur = 15;
                    ctx.shadowColor = '#00e5ff';
                    ctx.fillStyle = 'rgba(0, 229, 255, 0.1)';
                    ctx.beginPath(); ctx.arc(0, 0, 26, 0, Math.PI * 2); ctx.fill();
                    ctx.restore();

                    ctx.fillStyle = '#111922';
                    ctx.beginPath(); ctx.arc(0, 0, 18, 0, Math.PI * 2); ctx.fill();

                    ctx.fillStyle = '#1f2a33';
                    ctx.fillRect(-12, -12, 24, 24);

                    // Occhi azzurri luminosi
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = '#00ffff';
                    ctx.fillStyle = '#00ffff';
                    ctx.fillRect(-5, -15, 3, 3);
                    ctx.fillRect(2, -15, 3, 3);
                    ctx.shadowBlur = 0;

                    ctx.restore();
                }
            });
        }

        function drawHUD() {
            healthSpan.innerText = Math.max(0, Math.floor(player.health));
            enemiesLeftSpan.innerText = enemies.filter(e => e.health > 0).length;

            if (gameState === 'LOSE') {
                ctx.fillStyle = 'rgba(2, 3, 5, 0.94)';
                ctx.fillRect(0, 0, width, height);
                ctx.fillStyle = '#ff3333';
                ctx.font = 'bold 28px Courier New';
                ctx.textAlign = 'center';
                ctx.fillText("ROMA È CADUTA NELLE TENEBRE", width / 2, height / 2);
            }
            if (gameState === 'WIN') {
                ctx.fillStyle = 'rgba(2, 3, 5, 0.94)';
                ctx.fillRect(0, 0, width, height);
                ctx.fillStyle = '#00e5ff';
                ctx.font = 'bold 28px Courier New';
                ctx.textAlign = 'center';
                ctx.fillText("CRIPTA PURIFICATA! IL MALE È RESPINTO", width / 2, height / 2);
            }
        }

        function update() {
            if (gameState !== 'PLAYING') return;

            // Aggiorna posizione e IMPOSTA LA DIREZIONE in base al tasto premuto
            if (keys['up'] && player.y > 60) {
                player.y -= player.speed;
                player.direction = 'up';
            }
            if (keys['down'] && player.y < height - 200) {
                player.y += player.speed;
                player.direction = 'down';
            }
            if (keys['left'] && player.x > 50) {
                player.x -= player.speed;
                player.direction = 'left';
            }
            if (keys['right'] && player.x < width - 50) {
                player.x += player.speed;
                player.direction = 'right';
            }

            // Inseguimento nemici
            enemies.forEach(enemy => {
                if (enemy.health > 0) {
                    let dx = player.x - enemy.x;
                    let dy = player.y - enemy.y;
                    let dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist > 5) {
                        enemy.x += (dx / dist) * 0.65;
                        enemy.y += (dy / dist) * 0.65;
                    }

                    if (dist < 35) {
                        player.health -= 0.35;
                        if (player.health <= 0) gameState = 'LOSE';
                    }
                }
            });

            let aliveEnemies = enemies.filter(e => e.health > 0);
            if (aliveEnemies.length === 0 && gameState === 'PLAYING') {
                gameState = 'WIN';
            }
        }

        function checkCombat() {
            enemies.forEach(enemy => {
                let dx = player.x - enemy.x;
                let dy = player.y - enemy.y;
                let dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < 75 && enemy.health > 0) {
                    enemy.health -= 25;
                }
            });
        }

        function gameLoop() {
            update();
            drawBackground();
            drawPlayer();
            drawEnemies();
            drawHUD();
            requestAnimationFrame(gameLoop);
        }

        gameLoop();

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });
    </script>
</body>
</html>
