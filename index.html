<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lucius: L'Ombra di Roma</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #030508;
            overflow: hidden;
            color: #e0e0e0;
            font-family: 'Courier New', Courier, monospace;
            user-select: none;
            -webkit-user-select: none;
        }
        #gameCanvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 15px;
            box-sizing: border-box;
        }
        #hud {
            font-size: 18px;
            text-shadow: 2px 2px 6px #000;
            font-weight: bold;
            color: #00e5ff;
            background: rgba(0, 0, 0, 0.85);
            padding: 10px 18px;
            border-radius: 8px;
            border: 1px solid #005577;
            align-self: flex-start;
            pointer-events: auto;
            box-shadow: 0 0 10px rgba(0, 229, 255, 0.2);
        }
        #controls {
            position: relative;
            height: 170px;
            pointer-events: auto;
            width: 100%;
        }
        .btn {
            position: absolute;
            width: 70px;
            height: 70px;
            background-color: rgba(15, 25, 35, 0.9);
            border: 2px solid #00e5ff;
            border-radius: 50%;
            color: #00e5ff;
            font-size: 26px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.4);
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        .btn:active, .btn.pressed {
            background-color: rgba(0, 229, 255, 0.4);
            transform: scale(0.92);
        }
        #btnUp { left: 30px; bottom: 90px; }
        #btnDown { left: 30px; bottom: 5px; }
        #btnLeft { left: 8px; bottom: 48px; }
        #btnRight { left: 95px; bottom: 48px; }
        #btnAction { right: 25px; bottom: 35px; width: 85px; height: 85px; font-size: 34px; border-color: #ff3333; color: #ff3333; box-shadow: 0 0 20px rgba(255, 51, 51, 0.5); }
    </style>
</head>
<body>

    <canvas id="gameCanvas"></canvas>

    <div id="ui-layer">
        <div id="hud">
            LUCIUS | Vita: <span id="health">100</span> | Nemici: <span id="enemiesLeft">3</span>
        </div>
        
        <div id="controls">
            <div id="btnUp" class="btn">▲</div>
            <div id="btnDown" class="btn">▼</div>
            <div id="btnLeft" class="btn">◀</div>
            <div id="btnRight" class="btn">▶</div>
            <div id="btnAction" class="btn">⚔️</div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const healthSpan = document.getElementById('health');
        const enemiesLeftSpan = document.getElementById('enemiesLeft');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;
        let gameState = 'PLAYING';

        let player = {
            x: width / 2,
            y: height / 2,
            radius: 28,
            health: 100,
            speed: 4.5,
            isAttacking: false
        };

        let enemies = [
            { x: width * 0.75, y: height * 0.3, radius: 28, health: 50 },
            { x: width * 0.25, y: height * 0.7, radius: 28, health: 50 },
            { x: width * 0.80, y: height * 0.75, radius: 28, health: 50 }
        ];

        let keys = {};

        function setupButton(id, keyName) {
            const btn = document.getElementById(id);
            const pressOn = (e) => { e.preventDefault(); keys[keyName] = true; btn.classList.add('pressed'); };
            const pressOff = (e) => { e.preventDefault(); keys[keyName] = false; btn.classList.remove('pressed'); };
            btn.addEventListener('pointerdown', pressOn);
            btn.addEventListener('pointerup', pressOff);
            btn.addEventListener('pointerleave', pressOff);
        }

        setupButton('btnUp', 'up');
        setupButton('btnDown', 'down');
        setupButton('btnLeft', 'left');
        setupButton('btnRight', 'right');

        document.getElementById('btnAction').addEventListener('pointerdown', (e) => {
            e.preventDefault();
            if (!player.isAttacking) {
                player.isAttacking = true;
                checkCombat();
                setTimeout(() => player.isAttacking = false, 250);
            }
        });

        // Sfondo dettagliato delle catacombe romane
        function drawBackground() {
            let bgGradient = ctx.createLinearGradient(0, 0, 0, height);
            bgGradient.addColorStop(0, '#020305');
            bgGradient.addColorStop(0.5, '#070c12');
            bgGradient.addColorStop(1, '#010204');
            ctx.fillStyle = bgGradient;
            ctx.fillRect(0, 0, width, height);

            // Blocs di pietra e muri antichi
            ctx.strokeStyle = '#0b131a';
            ctx.lineWidth = 2;
            for (let x = 0; x < width; x += 100) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, height); ctx.stroke();
            }
            for (let y = 0; y < height; y += 100) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(width, y); ctx.stroke();
            }

            // Grande cerchio runico magico azzurro sul pavimento
            ctx.save();
            ctx.strokeStyle = 'rgba(0, 229, 255, 0.12)';
            ctx.lineWidth = 4;
            ctx.shadowBlur = 15;
            ctx.shadowColor = '#00e5ff';
            ctx.beginPath();
            ctx.arc(width / 2, height / 2, 220, 0, Math.PI * 2);
            ctx.stroke();
            ctx.beginPath();
            ctx.arc(width / 2, height / 2, 140, 0, Math.PI * 2);
            ctx.stroke();
            ctx.restore();
        }

        // --- LUCIUS: Dettagli altissimi (Armatura Lorica, Scudo, Elmo con cimiero) ---
        function drawPlayer() {
            ctx.save();
            ctx.translate(player.x, player.y);

            // Ombra sotto il personaggio
            ctx.fillStyle = 'rgba(0,0,0,0.6)';
            ctx.beginPath();
            ctx.arc(0, 22, 22, 0, Math.PI * 2);
            ctx.fill();

            // Mantello scuro consunto
            ctx.fillStyle = '#2a0a0a';
            ctx.beginPath();
            ctx.moveTo(-16, -10); ctx.lineTo(-24, 20); ctx.lineTo(0, 26); ctx.lineTo(16, 20); ctx.lineTo(12, -10);
            ctx.fill();

            // Tunica rossa romana
            ctx.fillStyle = '#8b1e1e';
            ctx.beginPath();
            ctx.arc(0, 0, 20, 0, Math.PI * 2);
            ctx.fill();

            // Armatura Lorica Segmentata (Placche d'acciaio con riflessi metallici)
            let armorGrad = ctx.createLinearGradient(-15, -15, 15, 15);
            armorGrad.addColorStop(0, '#9ab4c3');
            armorGrad.addColorStop(0.5, '#5c6e7a');
            armorGrad.addColorStop(1, '#343f47');
            ctx.fillStyle = armorGrad;
            ctx.beginPath();
            ctx.roundRect(-14, -14, 28, 28, 6);
            ctx.fill();

            // Linee delle fasce dell'armatura
            ctx.strokeStyle = '#222b30';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(-14, -6); ctx.lineTo(14, -6);
            ctx.moveTo(-14, 2); ctx.lineTo(14, 2);
            ctx.moveTo(-14, 10); ctx.lineTo(14, 10);
            ctx.stroke();

            // Elmo Romano (Galea) dettagliato con cimiero crestato rosso
            ctx.fillStyle = '#b0c4de';
            ctx.beginPath();
            ctx.arc(0, -12, 13, Math.PI, 0, false);
            ctx.fill();
            // Cimiero del centurione
            ctx.fillStyle = '#cc0000';
            ctx.beginPath();
            ctx.roundRect(-4, -26, 8, 16, 3);
            ctx.fill();

            // Scudo Romano (Scutum) con bordi dorati e umbone centrale
            ctx.fillStyle = '#7a140a';
            ctx.strokeStyle = '#d4af37';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.roundRect(-26, -16, 12, 32, 4);
            ctx.fill();
            ctx.stroke();
            // Umbone dorato dello scudo
            ctx.fillStyle = '#ffd700';
            ctx.beginPath();
            ctx.arc(-20, 0, 4, 0, Math.PI * 2);
            ctx.fill();

            // Gladius / Fendente d'attacco epico
            if (player.isAttacking) {
                ctx.save();
                ctx.shadowBlur = 25;
                ctx.shadowColor = '#00ffff';
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(0, 0, 38, -Math.PI/2, Math.PI/2);
                ctx.lineTo(0,0);
                ctx.fill();
                ctx.restore();
            } else {
                ctx.fillStyle = '#e0e0e0';
                ctx.fillRect(14, -3, 16, 5);
                ctx.fillStyle = '#d4af37';
                ctx.fillRect(12, -5, 4, 9);
            }

            ctx.restore();
        }

        // --- NEMICI: Legionari Ombra con armatura corrotta e occhi di brace azzurra ---
        function drawEnemies() {
            enemies.forEach(enemy => {
                if (enemy.health > 0) {
                    ctx.save();
                    ctx.translate(enemy.x, enemy.y);

                    // Ombra/Aura spettrale intensa attorno al soldato corrotto
                    ctx.save();
                    ctx.shadowBlur = 18;
                    ctx.shadowColor = '#00e5ff';
                    ctx.fillStyle = 'rgba(0, 229, 255, 0.12)';
                    ctx.beginPath();
                    ctx.arc(0, 0, 28, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();

                    // Corpo oscuro e melmoso
                    ctx.fillStyle = '#111922';
                    ctx.beginPath();
                    ctx.arc(0, 0, 20, 0, Math.PI * 2);
                    ctx.fill();

                    // Armatura arrugginita/corrotta
                    ctx.fillStyle = '#1f2a33';
                    ctx.beginPath();
                    ctx.roundRect(-14, -14, 28, 28, 5);
                    ctx.fill();

                    // Elmo antico corrotto
                    ctx.fillStyle = '#121a21';
                    ctx.beginPath();
                    ctx.arc(0, -12, 12, Math.PI, 0, false);
                    ctx.fill();

                    // Occhi con bagliore azzurro spettrale intenso
                    ctx.shadowBlur = 12;
                    ctx.shadowColor = '#00ffff';
                    ctx.fillStyle = '#00ffff';
                    ctx.fillRect(-5, -15, 4, 4);
                    ctx.fillRect(2, -15, 4, 4);
                    ctx.shadowBlur = 0;

                    ctx.restore();
                }
            });
        }

        function drawHUD() {
            healthSpan.innerText = Math.max(0, Math.floor(player.health));
            enemiesLeftSpan.innerText = enemies.filter(e => e.health > 0).length;

            if (gameState === 'LOSE') {
                ctx.fillStyle = 'rgba(2, 3, 5, 0.94)';
                ctx.fillRect(0, 0, width, height);
                ctx.fillStyle = '#ff3333';
                ctx.shadowBlur = 20;
                ctx.shadowColor = '#ff0000';
                ctx.font = 'bold 28px Courier New';
                ctx.textAlign = 'center';
                ctx.fillText("ROMA È CADUTA NELLE TENEBRE", width / 2, height / 2);
                ctx.shadowBlur = 0;
            }
            if (gameState === 'WIN') {
                ctx.fillStyle = 'rgba(2, 3, 5, 0.94)';
                ctx.fillRect(0, 0, width, height);
                ctx.fillStyle = '#00e5ff';
                ctx.shadowBlur = 20;
                ctx.shadowColor = '#00e5ff';
                ctx.font = 'bold 28px Courier New';
                ctx.textAlign = 'center';
                ctx.fillText("CRIPTA PURIFICATA! IL MALE È RESPINTO", width / 2, height / 2);
                ctx.shadowBlur = 0;
            }
        }

        function update() {
            if (gameState !== 'PLAYING') return;

            if (keys['up'] && player.y > 60) player.y -= player.speed;
            if (keys['down'] && player.y < height - 200) player.y += player.speed;
            if (keys['left'] && player.x > 50) player.x -= player.speed;
            if (keys['right'] && player.x < width - 50) player.x += player.speed;

            // Inseguimento dei nemici
            enemies.forEach(enemy => {
                if (enemy.health > 0) {
                    let dx = player.x - enemy.x;
                    let dy = player.y - enemy.y;
                    let dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist > 5) {
                        enemy.x += (dx / dist) * 0.7;
                        enemy.y += (dy / dist) * 0.7;
                    }

                    if (dist < 40) {
                        player.health -= 0.35;
                        if (player.health <= 0) gameState = 'LOSE';
                    }
                }
            });

            let aliveEnemies = enemies.filter(e => e.health > 0);
            if (aliveEnemies.length === 0 && gameState === 'PLAYING') {
                gameState = 'WIN';
            }
        }

        function checkCombat() {
            enemies.forEach(enemy => {
                let dx = player.x - enemy.x;
                let dy = player.y - enemy.y;
                let dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < 85 && enemy.health > 0) {
                    enemy.health -= 25;
                }
            });
        }

        function gameLoop() {
            update();
            drawBackground();
            drawPlayer();
            drawEnemies();
            drawHUD();
            requestAnimationFrame(gameLoop);
        }

        gameLoop();

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });
    </script>
</body>
</html>
