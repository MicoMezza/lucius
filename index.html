<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lucius: L'Ombra di Roma</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #050709;
            overflow: hidden;
            color: #e0e0e0;
            font-family: 'Courier New', Courier, monospace;
            user-select: none;
            -webkit-user-select: none;
        }
        #gameCanvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            box-sizing: border-box;
        }
        #hud {
            font-size: 18px;
            text-shadow: 2px 2px 6px #000;
            font-weight: bold;
            color: #00e5ff;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 15px;
            border-radius: 8px;
            border: 1px solid #005577;
            align-self: flex-start;
            pointer-events: auto;
        }
        #controls {
            display: flex;
            justify-content: space-between;
            pointer-events: auto;
            padding-bottom: 20px;
            width: 100%;
            box-sizing: border-box;
        }
        .btn {
            width: 80px;
            height: 80px;
            background-color: rgba(20, 35, 45, 0.85);
            border: 3px solid #00e5ff;
            border-radius: 50%;
            color: #00e5ff;
            font-size: 32px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.4);
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        .btn:active, .btn.pressed {
            background-color: rgba(0, 229, 255, 0.4);
            transform: scale(0.92);
        }
    </style>
</head>
<body>

    <canvas id="gameCanvas"></canvas>

    <div id="ui-layer">
        <div id="hud">
            LUCIUS | Vita: <span id="health">100</span>
        </div>
        <div id="controls">
            <div id="btnLeft" class="btn">◀</div>
            <div id="btnAction" class="btn">⚔️</div>
            <div id="btnRight" class="btn">▶</div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const healthSpan = document.getElementById('health');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;
        let gameState = 'PLAYING';

        let player = {
            x: 80,
            y: height / 2 - 30,
            width: 50,
            height: 70,
            health: 100,
            speed: 5,
            isAttacking: false
        };

        let enemies = [
            { x: width - 220, y: height / 2 - 120, width: 50, height: 70, health: 50 },
            { x: width - 150, y: height / 2, width: 50, height: 70, health: 50 },
            { x: width - 240, y: height / 2 + 100, width: 50, height: 70, health: 50 }
        ];

        let keys = {};

        // Gestione universale dei pulsanti (funziona sia con il Mouse su PC che con il Touch su Cellulare)
        function setupButton(id, keyName, actionCallback) {
            const btn = document.getElementById(id);
            
            const pressOn = (e) => {
                e.preventDefault();
                keys[keyName] = true;
                btn.classList.add('pressed');
                if (actionCallback) actionCallback();
            };
            
            const pressOff = (e) => {
                e.preventDefault();
                keys[keyName] = false;
                btn.classList.remove('pressed');
            };

            btn.addEventListener('pointerdown', pressOn);
            btn.addEventListener('pointerup', pressOff);
            btn.addEventListener('pointerleave', pressOff);
        }

        setupButton('btnLeft', 'left');
        setupButton('btnRight', 'right');
        setupButton('btnAction', 'action', () => {
            player.isAttacking = true;
            checkCombat();
            setTimeout(() => player.isAttacking = false, 200);
        });

        // Catacomba Dark Fantasy di sfondo
        function drawBackground() {
            let bgGradient = ctx.createLinearGradient(0, 0, 0, height);
            bgGradient.addColorStop(0, '#04070a');
            bgGradient.addColorStop(0.5, '#0a1118');
            bgGradient.addColorStop(1, '#020305');
            ctx.fillStyle = bgGradient;
            ctx.fillRect(0, 0, width, height);

            // Linee e rune di sfondo
            ctx.strokeStyle = '#0e1c26';
            ctx.lineWidth = 3;
            for (let i = 0; i < width; i += 140) {
                ctx.beginPath();
                ctx.moveTo(i, 0);
                ctx.lineTo(i, height);
                ctx.stroke();
            }
        }

        // Disegno vettoriale dettagliato di Lucius (Senza sfondi bianchi fastidiosi)
        function drawPlayer() {
            ctx.save();
            ctx.translate(player.x, player.y);

            // Mantello
            ctx.fillStyle = '#3a0f0f';
            ctx.beginPath();
            ctx.moveTo(5, 10); ctx.lineTo(-10, 65); ctx.lineTo(15, 65);
            ctx.fill();

            // Tunica
            ctx.fillStyle = '#7a1c1c';
            ctx.fillRect(8, 20, 34, 45);

            // Armatura Lorica Segmentata
            ctx.fillStyle = '#6b7c85';
            ctx.fillRect(11, 22, 28, 28);
            ctx.fillStyle = '#455158';
            ctx.fillRect(11, 26, 28, 3);
            ctx.fillRect(11, 33, 28, 3);
            ctx.fillRect(11, 40, 28, 3);

            // Elmo con cimiero
            ctx.fillStyle = '#9cb0bc';
            ctx.fillRect(9, 2, 30, 20);
            ctx.fillStyle = '#b30000';
            ctx.fillRect(19, -8, 10, 12);

            // Scudo (Scutum)
            ctx.fillStyle = '#8b1e0f';
            ctx.fillRect(-8, 22, 14, 38);
            ctx.strokeStyle = '#d4af37';
            ctx.lineWidth = 2;
            ctx.strokeRect(-8, 22, 14, 38);
            ctx.fillStyle = '#d4af37';
            ctx.beginPath();
            ctx.arc(-1, 41, 4, 0, Math.PI * 2);
            ctx.fill();

            // Gladius (Spada) o fendente
            if (player.isAttacking) {
                ctx.shadowBlur = 15;
                ctx.shadowColor = '#ffffff';
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(40, 24, 30, 7);
                ctx.shadowBlur = 0;
            } else {
                ctx.fillStyle = '#d0d0d0';
                ctx.fillRect(35, 28, 18, 5);
                ctx.fillStyle = '#d4af37';
                ctx.fillRect(33, 27, 4, 7);
            }

            ctx.restore();
        }

        // Disegno dei Legionari Ombra (Senza sfondi bianchi)
        function drawEnemies() {
            enemies.forEach(enemy => {
                if (enemy.health > 0) {
                    ctx.save();
                    ctx.translate(enemy.x, enemy.y);

                    // Aura spettrale
                    ctx.fillStyle = 'rgba(0, 229, 255, 0.08)';
                    ctx.beginPath();
                    ctx.arc(25, 35, 35, 0, Math.PI * 2);
                    ctx.fill();

                    // Corpo e armatura corrotta
                    ctx.fillStyle = '#16222b';
                    ctx.fillRect(8, 20, 34, 45);
                    ctx.fillStyle = '#2b3942';
                    ctx.fillRect(11, 22, 28, 28);
                    ctx.fillStyle = '#1a242c';
                    ctx.fillRect(9, 2, 30, 20);

                    // Occhi azzurri luminosi
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = '#00e5ff';
                    ctx.fillStyle = '#00ffff';
                    ctx.fillRect(15, 9, 5, 5);
                    ctx.fillRect(28, 9, 5, 5);
                    ctx.shadowBlur = 0;

                    ctx.restore();
                }
            });
        }

        function drawHUD() {
            healthSpan.innerText = Math.max(0, Math.floor(player.health));

            if (gameState === 'LOSE') {
                ctx.fillStyle = 'rgba(2, 3, 5, 0.9)';
                ctx.fillRect(0, 0, width, height);
                ctx.fillStyle = '#ff3333';
                ctx.font = 'bold 26px Courier New';
                ctx.textAlign = 'center';
                ctx.fillText("ROMA È CADUTA NELLE TENEBRE", width / 2, height / 2);
            }
            if (gameState === 'WIN') {
                ctx.fillStyle = 'rgba(2, 3, 5, 0.9)';
                ctx.fillRect(0, 0, width, height);
                ctx.fillStyle = '#00e5ff';
                ctx.font = 'bold 26px Courier New';
                ctx.textAlign = 'center';
                ctx.fillText("CRIPTA PURIFICATA! IL MALE È RESPINTO", width / 2, height / 2);
            }
        }

        function update() {
            if (gameState !== 'PLAYING') return;

            if (keys['left'] && player.x > 20) player.x -= player.speed;
            if (keys['right'] && player.x < width - 70) player.x += player.speed;

            enemies.forEach(enemy => {
                if (enemy.health > 0) {
                    if (enemy.x > player.x) enemy.x -= 0.6;
                    if (enemy.x < player.x) enemy.x += 0.6;

                    if (
                        player.x < enemy.x + enemy.width &&
                        player.x + player.width > enemy.x &&
                        player.y < enemy.y + enemy.height &&
                        player.y + player.height > enemy.y
                    ) {
                        player.health -= 0.4;
                        if (player.health <= 0) gameState = 'LOSE';
                    }
                }
            });

            enemies = enemies.filter(e => e.health > 0);

            if (enemies.length === 0 && gameState === 'PLAYING') {
                gameState = 'WIN';
            }
        }

        function checkCombat() {
            enemies.forEach(enemy => {
                if (
                    player.x + player.width + 35 > enemy.x &&
                    player.x < enemy.x + enemy.width &&
                    player.y - 20 < enemy.y + enemy.height &&
                    player.y + player.height + 20 > enemy.y
                ) {
                    enemy.health -= 25;
                }
            });
        }

        function gameLoop() {
            update();
            drawBackground();
            drawPlayer();
            drawEnemies();
            drawHUD();
            requestAnimationFrame(gameLoop);
        }

        gameLoop();

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });
    </script>
</body>
</html>
