name: Build Lucius APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Capacitor
        run: |
          npm init -y || true
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Init Capacitor + Copy Web
        run: |
          echo '{"appId":"com.domenico.lucius","appName":"Lucius","webDir":".","bundledWebRuntime":false}' > capacitor.config.json
          npx cap add android || true
          npx cap copy android

      - name: Build APK Debug
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lucius-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
