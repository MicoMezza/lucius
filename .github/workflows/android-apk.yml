name: Build Lucius APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Fix webDir and prepare www
        run: |
          mkdir -p www
          cp index.html www/index.html || true
          cp -r assets www/ || true
          echo '{"appId":"com.micomezza.lucius","appName":"Lucius","webDir":"www","bundledWebRuntime":false}' > capacitor.config.json
          cat capacitor.config.json

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Build APK Debug
        working-directory: ./android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lucius-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
